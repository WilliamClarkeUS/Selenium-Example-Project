# Reusable steps: build, run, publish. Used by every stage in azure-pipelines.yml.
parameters:
  - name: groups
    type: string
    default: 'smoke | regression'

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: ./mvnw -B test -Dgroups="${{ parameters.groups }}"
    displayName: Run Selenium tests
    env:
      BASE_URL: $(BASE_URL)

  # condition: always() = publish results even when tests fail.
  - task: PublishTestResults@2
    displayName: Publish test results (shows in the Tests tab)
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: target/surefire-reports/TEST-*.xml

  - task: PublishPipelineArtifact@1
    displayName: Publish failure screenshots
    condition: failed()
    inputs:
      targetPath: target/screenshots
      artifact: screenshots-$(System.JobAttempt)
