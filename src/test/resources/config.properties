# Default settings. Anything here can be overridden on the command line (-Dname=value)
# or, for the URL, with the BASE_URL environment variable.
#
# NOTE: the site URL is deliberately NOT here. See config/TestConfig.java for why.

browser=chrome
headless=true
# Explicit wait: how long to wait for an element before failing (seconds)
timeout.seconds=15
window.width=1280
window.height=720
